server:
  port: ${SERVER_PORT:18090}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{28} - %msg%n"
  tomcat:
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: flashmart-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13307}/flashmart?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:redis123456}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9877}
  producer:
    group: flashmart-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 3

flashmart:
  jwt:
    secret: ${JWT_SECRET:flashmart-dev-secret-key-please-change-in-production}
    expire-hours: 24
  cache:
    # 活动详情缓存的逻辑过期时间（秒）：过期后由后台线程异步重建，请求不阻塞
    activity-logic-expire-seconds: 60
    # 空值缓存 TTL（秒）：防止不存在的活动反复打到数据库
    null-value-ttl-seconds: 30
    # 延迟双删的延迟时间（秒）：更新库并删缓存后再延迟删一次，
    # 清掉并发读请求可能回填的旧值。RocketMQ 最小档位是 1 秒，所以这里按秒配
    double-delete-delay-seconds: 5
  seckill:
    # 订单超时未支付的关单时间（秒）—— 生产按业务定，演示用 30 秒便于观察。
    # 注意：RocketMQ 延迟消息只支持固定档位（1s/5s/10s/30s/1m…），这里会自动取最接近且不小于它的档位
    order-timeout-seconds: 30
  # 应用层 IP 黑名单：被限流的客户端在过滤器层就拒掉，不用再跑限流 Lua。
  # 下面四个都是「策略值」，不是实测最优值 —— 生产必须按真实流量分布调（下面给的是演示默认值）。
  blacklist:
    # 总开关：关掉后过滤器只做一次开关判断，连 Redis 都不查
    enabled: true
    # 违规阈值（次）：窗口内被限流拒绝这么多次就封禁；调小=封得狠但误伤多，调大=更宽容
    violation-threshold: 20
    # 违规统计窗口（秒）：只统计这个时间窗内的违规次数，窗口过后计数自动过期（不是永久累积）
    violation-window-seconds: 60
    # 封禁时长（秒）：封禁到期自动解封，无需人工干预；压测可用启动参数覆盖成 60
    ban-seconds: 300
