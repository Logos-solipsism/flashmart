services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: flashmart-mysql
    ports:
      # 宿主机映射到 13307（容器内仍是 3306），避开本机其他项目占用的 3306 / 13306
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: flashmart
      TZ: Asia/Shanghai
    # 服务端字符集直接作为 mysqld 参数传给官方 entrypoint：不经过配置文件，不受宿主机文件权限影响。
    # 客户端字符集（初始化导入 .sql 时用的是 mysql 客户端）见下面的 entrypoint 说明。
    entrypoint:
      - bash
      - -c
      - |
        set -e
        # Windows 的 bind mount 权限固定是 777，而 MySQL 会静默忽略 world-writable 的配置文件
        # （日志：World-writable config file '/etc/mysql/conf.d/charset.cnf' is ignored）。
        # 所以不直接挂进 conf.d，而是挂到 /opt 再以 0644 复制进去：权限由镜像内文件系统保证。
        install -m 0644 /opt/flashmart-client.cnf /etc/mysql/conf.d/charset.cnf
        exec /usr/local/bin/docker-entrypoint.sh mysqld \
          --character-set-server=utf8mb4 \
          --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 逐个挂载并加数字前缀：容器按文件名字母序执行初始化脚本
      - ./server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql
      # 初始化用的 mysql 客户端必须是 utf8mb4，否则中文种子数据会二次编码成乱码；
      # 故意不挂到 /etc/mysql/conf.d，由上面的 entrypoint 复制成 0644 后再生效
      - ./deploy/mysql-client.cnf:/opt/flashmart-client.cnf:ro

  redis:
    image: redis:7.2
    restart: unless-stopped
    container_name: flashmart-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --requirepass redis123456
    volumes:
      - redis-data:/data

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    restart: unless-stopped
    container_name: flashmart-namesrv
    ports:
      - "9877:9876"
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    restart: unless-stopped
    container_name: flashmart-broker
    # 数据卷默认属于 root，而 RocketMQ 默认以 rocketmq 用户运行 → 会写不进存储目录导致启动失败
    user: root
    depends_on:
      - rocketmq-namesrv
    ports:
      # listenPort 与 broker.conf 保持一致；HA 端口只是备用，映射到 10913 避开其他项目
      - "10913:10909"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -c /home/rocketmq/broker.conf
    volumes:
      - ./deploy/broker.conf:/home/rocketmq/broker.conf
      - rocketmq-store:/home/rocketmq/store

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    restart: unless-stopped
    container_name: flashmart-dashboard
    depends_on:
      - rocketmq-namesrv
    ports:
      - "8181:8080"
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
