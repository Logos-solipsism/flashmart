brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 宿主机可访问的 broker 地址与端口（Docker 场景必配，否则宿主机上的客户端拿到的会是容器内网地址）
# 注意 listenPort 必须与宿主机映射的端口一致：客户端是拿"brokerIP1:listenPort"去连的
brokerIP1 = 127.0.0.1
listenPort = 10912
namesrvAddr = rocketmq-namesrv:9876
autoCreateTopicEnable = true
